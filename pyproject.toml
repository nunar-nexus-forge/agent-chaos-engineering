[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-chaos-engineering"
version = "0.1.0"
description = "Chaos engineering and self-healing recovery patterns for multi-agent LLM systems: inject hallucination loops, tool failures, cyclic dependencies and stale memory, then measure how the system degrades and recovers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "nunar-nexus-forge" }]
keywords = [
  "agent-chaos-engineering",
  "chaos-engineering", "resilience", "self-healing", "multi-agent", "llm", "agents",
  "fault-injection", "langgraph", "reliability", "adversarial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
yaml = ["pyyaml>=6.0"]
all = ["langgraph>=0.2", "langchain-core>=0.3", "pyyaml>=6.0"]

[project.scripts]
agent-chaos = "agent_chaos.cli:main"

[project.urls]
Homepage = "https://github.com/nunar-nexus-forge/agent-chaos-engineering"
Documentation = "https://github.com/nunar-nexus-forge/agent-chaos-engineering/tree/main/docs"
Changelog = "https://github.com/nunar-nexus-forge/agent-chaos-engineering/blob/main/CHANGELOG.md"
Issues = "https://github.com/nunar-nexus-forge/agent-chaos-engineering/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pyyaml>=6.0",
]
frameworks = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_chaos"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_chaos", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CITATION.cff"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF012", "SIM108", "B905", "RUF005", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
files = ["src/agent_chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agent_chaos"]
